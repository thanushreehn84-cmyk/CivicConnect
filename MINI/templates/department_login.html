
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Department Login | CivicConnect</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        header {
            background: #1769aa;
            color: white;
            padding: 20px 30px;
            font-size: 23px;
            font-weight: bold;
        }

        .login-container {
            max-width: 420px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            color: #1769aa;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            background: white;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d4f85;
        }

        .error {
            color: #c62828;
            background: #ffe5e5;
            padding: 12px;
            text-align: center;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<header>
    CivicConnect
</header>

<div class="login-container">

    <h2>Department Login</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('department_login') }}">

        <label for="department">Select Department</label>

        <select name="department" id="department" required>

            <option value="">-- Select Department --</option>

            {% for dept in departments %}
                <option value="{{ dept }}"
                    {% if selected_department == dept %}selected{% endif %}>
                    {{ dept }}
                </option>
            {% endfor %}

        </select>

        <label for="username">Username</label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
